<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bram's World</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; overflow: hidden; font-family: 'Courier New', monospace; }
  #canvas { display: block; width: 100vw; height: 100vh; }

  #overlay {
    position: fixed; inset: 0; background: #0a0a0a;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    z-index: 100; transition: opacity 0.8s ease;
  }
  #overlay h1 {
    font-size: clamp(3rem, 10vw, 8rem); font-weight: 900;
    letter-spacing: -0.02em; color: #fff; line-height: 0.9; text-align: center;
  }
  #overlay h1 span { color: #FFD700; }
  #overlay p { margin-top: 2rem; color: #666; font-size: 0.85rem; letter-spacing: 0.2em; text-transform: uppercase; }

  #menu { margin-top: 3rem; display: flex; gap: 1.25rem; flex-wrap: wrap; justify-content: center; }
  .menu-btn {
    padding: 1rem 2.5rem; border: 1px solid #333;
    background: transparent; color: #fff; font-family: inherit;
    font-size: 0.8rem; letter-spacing: 0.3em; text-transform: uppercase;
    cursor: pointer; transition: all 0.3s; text-decoration: none;
  }
  .menu-btn:hover { background: #FFD700; color: #000; border-color: #FFD700; }
  .menu-btn.secondary { color: #888; }
  .menu-btn.secondary:hover { background: #222; color: #fff; border-color: #555; }

  #crosshair {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%);
    pointer-events: none; opacity: 0; transition: opacity 0.5s;
  }
  #crosshair::before, #crosshair::after {
    content: ''; position: absolute; background: rgba(255,255,255,0.7);
  }
  #crosshair::before { width: 1px; height: 14px; top: -7px; left: 0; }
  #crosshair::after  { width: 14px; height: 1px; left: -7px; top: 0; }

  #hud {
    position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%);
    color: rgba(255,255,255,0.4); font-size: 0.7rem; letter-spacing: 0.2em;
    text-transform: uppercase; opacity: 0; transition: opacity 0.5s; pointer-events: none;
  }
</style>
</head>
<body>

<canvas id="canvas"></canvas>

<div id="overlay">
  <h1>BRAM<br><span>SPIRA</span></h1>
  <p>Personal Universe</p>
  <div id="menu">
    <button id="enter-btn" class="menu-btn">Enter World →</button>
    <a href="resume.html" class="menu-btn secondary">Boring Version</a>
  </div>
</div>

<div id="crosshair"></div>
<div id="hud">WASD · Move &nbsp;|&nbsp; Space · Jump &nbsp;|&nbsp; Mouse · Look</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ── DOM refs ──
const canvas    = document.getElementById('canvas');
const overlay   = document.getElementById('overlay');
const crosshair = document.getElementById('crosshair');
const hud       = document.getElementById('hud');

// ── RENDERER ──
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;

// ── SCENE + CAMERA ──
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xdfe4ea);
scene.fog = new THREE.Fog(0xdfe4ea, 14, 34);

const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.1, 100);
camera.position.set(0, 1.7, 6);
camera.rotation.order = 'YXZ';

// ── LIGHTING ──
const hemi = new THREE.HemisphereLight(0xffffff, 0x9a8b7a, 0.9);
scene.add(hemi);

const key = new THREE.DirectionalLight(0xfff4e0, 2.2);
key.position.set(6, 10, 4);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.near = 1;
key.shadow.camera.far = 40;
key.shadow.camera.left = -12;
key.shadow.camera.right = 12;
key.shadow.camera.top = 12;
key.shadow.camera.bottom = -12;
key.shadow.bias = -0.0004;
key.shadow.radius = 4;
scene.add(key);

const fill = new THREE.DirectionalLight(0xbcd2ff, 0.5);
fill.position.set(-8, 6, -6);
scene.add(fill);

// ── TEXTURE ──
function gridTexture() {
  const size = 512, c = document.createElement('canvas');
  c.width = c.height = size;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#c8ccd2';
  ctx.fillRect(0, 0, size, size);
  ctx.strokeStyle = '#b3b8bf';
  ctx.lineWidth = 2;
  for (let i = 0; i <= size; i += 64) {
    ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, size); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(size, i); ctx.stroke();
  }
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(8, 8);
  tex.anisotropy = 8;
  tex.encoding = THREE.sRGBEncoding;
  return tex;
}

// ── ROOM ──
const RW = 16, RH = 6, RD = 16;

const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(RW, RD),
  new THREE.MeshStandardMaterial({ map: gridTexture(), roughness: 0.9, metalness: 0.0 })
);
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);

const ceiling = new THREE.Mesh(
  new THREE.PlaneGeometry(RW, RD),
  new THREE.MeshStandardMaterial({ color: 0xf0f2f5, roughness: 1.0 })
);
ceiling.rotation.x = Math.PI / 2;
ceiling.position.y = RH;
scene.add(ceiling);

const wallMat = new THREE.MeshStandardMaterial({ color: 0xe4e7ec, roughness: 0.95, metalness: 0.0 });
function wall(w, h, x, y, z, ry) {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), wallMat);
  m.position.set(x, y, z);
  m.rotation.y = ry;
  m.receiveShadow = true;
  scene.add(m);
}
wall(RW, RH, 0, RH / 2, -RD / 2, 0);
wall(RW, RH, 0, RH / 2, RD / 2, Math.PI);
wall(RD, RH, -RW / 2, RH / 2, 0, Math.PI / 2);
wall(RD, RH, RW / 2, RH / 2, 0, -Math.PI / 2);

// ── SHOWCASE BLOCK ──
const block = new THREE.Mesh(
  new THREE.BoxGeometry(1.4, 1.4, 1.4),
  new THREE.MeshStandardMaterial({ color: 0xffcf4d, roughness: 0.35, metalness: 0.25 })
);
block.position.set(0, 0.7, 0);
block.castShadow = true;
block.receiveShadow = true;
scene.add(block);

// ── PLAYER STATE ──
const keys = {};
let yaw = 0, pitch = 0;
let isLocked = false;
let yVel = 0, onGround = true;

const SPEED = 0.065;
const LIMIT = 7.4;
const GRAVITY = -0.012;
const JUMP = 0.18;

// ── INPUT ──
document.addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code === 'Space') {
    e.preventDefault();
    if (onGround && isLocked) { yVel = JUMP; onGround = false; }
  }
});
document.addEventListener('keyup', e => { keys[e.code] = false; });

document.addEventListener('mousemove', e => {
  if (!isLocked) return;
  yaw -= e.movementX * 0.002;
  pitch -= e.movementY * 0.002;
  pitch = Math.max(-Math.PI / 3, Math.min(Math.PI / 3, pitch));
});

document.addEventListener('pointerlockchange', () => {
  isLocked = (document.pointerLockElement === canvas);
  crosshair.style.opacity = isLocked ? '1' : '0';
  hud.style.opacity = isLocked ? '1' : '0';
});

canvas.addEventListener('click', () => {
  if (!isLocked && overlay.style.display === 'none') canvas.requestPointerLock();
});

document.getElementById('enter-btn').addEventListener('click', () => {
  overlay.style.opacity = '0';
  setTimeout(() => {
    overlay.style.display = 'none';
    canvas.requestPointerLock();
  }, 800);
});

// ── LOOP ──
let t = 0;
function animate() {
  requestAnimationFrame(animate);
  t += 0.01;

  camera.rotation.y = yaw;
  camera.rotation.x = pitch;

  if (isLocked) {
    const dir = new THREE.Vector3();
    if (keys['KeyW']) dir.z -= 1;
    if (keys['KeyS']) dir.z += 1;
    if (keys['KeyA']) dir.x -= 1;
    if (keys['KeyD']) dir.x += 1;

    if (dir.lengthSq() > 0) {
      dir.normalize().multiplyScalar(SPEED).applyEuler(new THREE.Euler(0, yaw, 0));
      const nx = camera.position.x + dir.x;
      const nz = camera.position.z + dir.z;
      if (Math.abs(nx) < LIMIT) camera.position.x = nx;
      if (Math.abs(nz) < LIMIT) camera.position.z = nz;
    }

    yVel += GRAVITY;
    camera.position.y += yVel;
    if (camera.position.y <= 1.7) { camera.position.y = 1.7; yVel = 0; onGround = true; }
  }

  block.rotation.y = t * 0.4;

  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
